# Nginx: load balancer in front of the app replicas.
# Caddy (TLS) -> this Nginx -> app1 / app2. Static assets are cached at the edge.

upstream hr_app {
    # Send each request to the replica with the fewest active connections.
    least_conn;
    # Passive health checks: after 3 failures a replica is skipped for 10s.
    server app1:4000 max_fails=3 fail_timeout=10s;
    server app2:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Edge cache for the hashed, immutable Vite bundles.
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=200m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;    # resumes are capped at 5 MB by the API

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Caddy terminates TLS and tells us the original scheme; keep it so secure cookies work.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    # If a replica is down, retry the request on the other one. Nginx never retries
    # non-idempotent requests (POST/PATCH) unless told to, so writes are not duplicated.
    proxy_next_upstream error timeout http_502 http_503;

    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        proxy_pass http://hr_app;
        proxy_cache static;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Edge-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://hr_app;
        add_header X-Upstream $upstream_addr always;
    }
}
